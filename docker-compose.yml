version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: hr_management_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-hr_management}
      MYSQL_USER: ${DB_USERNAME:-hr_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hr_password}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - hr_network

  redis:
    image: redis:7.0-alpine
    container_name: hr_management_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - hr_network

networks:
  hr_network:
    driver: bridge

volumes:
  db_data:
